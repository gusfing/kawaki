<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kawaki blog cover</title>
<!-- Rendered at 1376x768 by scripts/make-blog-cover.js. Parameters: ?t=title&k=topic&s=seed&w=word1|word2|cut:word3 -->
<style>
  @font-face { font-family: 'Bricolage'; src: url('../../public/assets/fonts/bricolage-display.woff2') format('woff2'); font-weight: 640 800; font-stretch: 75% 92%; }
  @font-face { font-family: 'Bricolage'; src: url('../../public/assets/fonts/bricolage-text.woff2') format('woff2'); font-weight: 400 639; font-stretch: 88% 100%; }
  @font-face { font-family: 'Geist Mono'; src: url('../../public/assets/fonts/geist-mono-400_600-normal.woff2') format('woff2'); font-weight: 400 600; }
  :root { --indigo: #23003F; --red: #F94500; --yellow: #FFFDB4; --lilac: #BCACCE; --raised: #2E0B4F; }
  html, body { margin: 0; }
  body { width: 1376px; height: 768px; overflow: hidden; position: relative; background: var(--indigo); color: var(--yellow); font-family: 'Bricolage', system-ui, sans-serif; }
  .meta { position: absolute; left: 64px; top: 56px; display: flex; gap: 18px; font: 500 17px/1 'Geist Mono', monospace; letter-spacing: 0.1em; text-transform: uppercase; color: var(--lilac); }
  .meta b { color: var(--red); font-weight: 500; }
  .title { position: absolute; left: 60px; bottom: 112px; width: 780px; margin: 0; font-weight: 790; font-stretch: 82%; line-height: 0.95; letter-spacing: -0.032em; text-wrap: balance; }
  .strip { position: absolute; left: 64px; right: 64px; bottom: 44px; display: flex; align-items: center; gap: 18px; padding-top: 20px; border-top: 1.5px solid rgba(188, 172, 206, 0.35); font: 500 16px/1 'Geist Mono', monospace; letter-spacing: 0.08em; text-transform: uppercase; white-space: nowrap; overflow: hidden; }
  .strip .cut { color: var(--lilac); text-decoration: line-through; text-decoration-color: var(--red); text-decoration-thickness: 2px; }
  .strip .sep { color: var(--red); }
  .strip .arrow { display: inline-block; width: 54px; height: 1.5px; background: var(--lilac); position: relative; }
  .strip .arrow::after { content: ""; position: absolute; right: 0; top: -4px; width: 8px; height: 8px; border-top: 1.5px solid var(--lilac); border-right: 1.5px solid var(--lilac); transform: rotate(45deg); }
  .art { position: absolute; right: 0; top: 0; width: 560px; height: 660px; }
  .shape { position: absolute; }
  .badge { border-radius: 50%; display: grid; place-items: center; }
  .badge svg { width: 56%; height: 56%; }
  .panel { background: var(--lilac); }
  .ring { border-radius: 50%; border: 2px solid var(--lilac); }
  .squiggle { color: var(--lilac); }
</style>
</head>
<body>
  <p class="meta"><b>Kawaki Studios</b><span>Blog</span><span id="topic"></span></p>
  <h1 class="title" id="title"></h1>
  <div class="art" id="art"></div>
  <div class="strip" id="strip"></div>
<script>
  const q = new URLSearchParams(location.search);
  const title = q.get('t') || 'Untitled';
  const topic = q.get('k') || 'Engineering';
  let seed = 0; for (const ch of (q.get('s') || title)) seed = (seed * 31 + ch.charCodeAt(0)) >>> 0;
  const rnd = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };
  document.getElementById('topic').textContent = topic;
  const h = document.getElementById('title');
  h.textContent = title;
  // Fit the title: as large as possible inside 780 x 470.
  let size = 132;
  h.style.fontSize = size + 'px';
  while ((h.scrollHeight > 470 || h.scrollWidth > 790) && size > 52) { size -= 4; h.style.fontSize = size + 'px'; }

  const ASTERISK = '<svg viewBox="0 0 40 40"><path d="M20 6v28M8 13l24 14M8 27l24-14" stroke="currentColor" stroke-width="5" stroke-linecap="round"/></svg>';
  const SPARK = '<svg viewBox="0 0 40 40"><path d="M20 4c1.6 9.4 6.6 14.4 16 16-9.4 1.6-14.4 6.6-16 16-1.6-9.4-6.6-14.4-16-16 9.4-1.6 14.4-6.6 16-16z" fill="currentColor"/></svg>';
  const SQUIGGLE = '<svg viewBox="0 0 96 40"><path d="M4 30c8 0 9-24 18-24s9 24 18 24 9-12 16-12h34M80 9l11 9-11 9" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  const art = document.getElementById('art');
  const add = (cls, css, html) => { const d = document.createElement('div'); d.className = 'shape ' + cls; Object.assign(d.style, css); if (html) d.innerHTML = html; art.appendChild(d); };
  const v = Math.floor(rnd() * 3);
  const j = n => Math.round((rnd() - 0.5) * n);
  if (v === 0) {
    add('panel', { left: 150 + j(40) + 'px', top: 70 + j(30) + 'px', width: '330px', height: '420px' });
    add('badge', { left: 70 + j(30) + 'px', top: 300 + j(50) + 'px', width: '220px', height: '220px', background: 'var(--red)', color: 'var(--indigo)' }, ASTERISK);
    add('badge', { left: 380 + j(20) + 'px', top: 40 + j(30) + 'px', width: '110px', height: '110px', background: 'var(--indigo)', color: 'var(--yellow)' }, SPARK);
  } else if (v === 1) {
    add('ring', { left: 90 + j(40) + 'px', top: 60 + j(40) + 'px', width: '400px', height: '400px' });
    add('badge', { left: 230 + j(40) + 'px', top: 190 + j(40) + 'px', width: '250px', height: '250px', background: 'var(--red)', color: 'var(--indigo)' }, SPARK);
    add('squiggle', { left: 40 + j(20) + 'px', top: 470 + j(30) + 'px', width: '230px', height: '96px' }, SQUIGGLE);
  } else {
    add('panel', { left: 60 + j(30) + 'px', top: 130 + j(40) + 'px', width: '440px', height: '260px' });
    add('badge', { left: 330 + j(30) + 'px', top: 40 + j(30) + 'px', width: '180px', height: '180px', background: 'var(--red)', color: 'var(--indigo)' }, ASTERISK);
    add('badge', { left: 120 + j(30) + 'px', top: 340 + j(30) + 'px', width: '130px', height: '130px', background: 'var(--yellow)', color: 'var(--indigo)' }, SPARK);
  }
  // Strip of kept and struck words, the homepage motif.
  const words = (q.get('w') || 'Plain words|cut:Filler|Real work|cut:Templates').split('|');
  document.getElementById('strip').innerHTML = words.map(w => w.startsWith('cut:')
    ? `<span class="cut">${w.slice(4)}</span><span class="arrow"></span>`
    : `<span>${w}</span><span class="sep">&#10035;</span>`).join('');
  document.body.dataset.ready = '1';
</script>
</body>
</html>
