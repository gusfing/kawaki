<style>

<body>
  <div class="grid-bg"></div>
  <p class="meta"><b>Kawaki Studios</b><span class="sep">/</span><span>Engineering Insight</span><span class="sep">/</span><span id="topic"></span></p>
  <div class="coord"><span>●</span>ENGINEERING SPEC // 2026</div>
  <h1 class="title" id="title"></h1>
  <div class="art" id="art"></div>
  <div class="strip" id="strip"></div>

<script>
  const q = new URLSearchParams(location.search);
  const title = q.get('t') || 'Untitled';
  const topic = q.get('k') || 'Engineering';
  const slug = (q.get('s') || '').toLowerCase();
  
  document.getElementById('topic').textContent = topic;
  const h = document.getElementById('title');
  h.textContent = title;
  
  // Title sizing
  let size = 120;
  h.style.fontSize = size + 'px';
  while ((h.scrollHeight > 450 || h.scrollWidth > 740) && size > 46) {
    size -= 4;
    h.style.fontSize = size + 'px';
  }

  const ASTERISK = '<svg viewBox="0 0 40 40"><path d="M20 6v28M8 13l24 14M8 27l24-14" stroke="currentColor" stroke-width="5" stroke-linecap="round"/></svg>';
  const SPARK = '<svg viewBox="0 0 40 40"><path d="M20 4c1.6 9.4 6.6 14.4 16 16-9.4 1.6-14.4 6.6-16 16-1.6-9.4-6.6-14.4-16-16 9.4-1.6 14.4-6.6 16-16z" fill="currentColor"/></svg>';

  const art = document.getElementById('art');

  // Intelligent Component Generator Based on Subject Matter
  function renderVisual() {
    const isAi = slug.includes('ai') || slug.includes('rag') || slug.includes('cite') || slug.includes('geo') || slug.includes('search') || slug.includes('agent');
    const isShopify = slug.includes('shopify') || slug.includes('commerce') || slug.includes('decoupled') || slug.includes('liquid') || slug.includes('migration') || slug.includes('apps-vs');
    const isSecurity = slug.includes('malware') || slug.includes('redirect') || slug.includes('hack') || slug.includes('backdoor') || slug.includes('japanese');
    const isNext = slug.includes('nextjs') || slug.includes('server-vs-client') || slug.includes('state-management');

    if (isAi) {
      // Archetype 1: AI, RAG & Search Retrieval Pipeline
      art.innerHTML = `
        <div class="v-card">
          <div class="v-titlebar">
            <div class="v-dots"><div class="v-dot red"></div><div class="v-dot yellow"></div><div class="v-dot lilac"></div></div>
            <span class="v-filename">rag-attribution-pipeline.ts</span>
            <span class="v-status">RAG 04 // ACTIVE</span>
          </div>
          <pre class="v-code">
<span class="kw">async function</span> <span class="fn">resolveCitations</span>(query: <span class="str">Prompt</span>) {
  <span class="cmt">// 1. Multi-query fan-out &amp; dense fetch</span>
  <span class="kw">const</span> chunks = <span class="kw">await</span> <span class="fn">retrieveContext</span>(query);
  
  <span class="cmt">// 2. Cross-encoder re-ranking &amp; pruning</span>
  <span class="kw">const</span> ranked = <span class="fn">crossEncoder</span>(chunks, { <span class="key">topK</span>: <span class="val">5</span> });
  
  <span class="cmt">// 3. Extractive NLI attribution check</span>
  <span class="kw">const</span> verified = <span class="fn">verifyEntailment</span>(claim, ranked);
  <span class="kw">return</span> { <span class="key">sourceUrl</span>: verified.url, <span class="key">score</span>: <span class="val">0.984</span> };
}</pre>
        </div>
        <div class="badge-overlap red" style="bottom: 40px; right: 20px;">
          ${ASTERISK}
        </div>
      `;
    } else if (isShopify) {
      // Archetype 2: Decoupled Headless Commerce Architecture
      art.innerHTML = `
        <div class="v-card">
          <div class="v-titlebar">
            <div class="v-dots"><div class="v-dot red"></div><div class="v-dot yellow"></div><div class="v-dot lilac"></div></div>
            <span class="v-filename">storefront-topology.yml</span>
            <span class="v-status">HEADLESS // EDGE</span>
          </div>
          <div class="v-arch">
            <div class="v-node accent">
              <div>
                <div class="v-node-title">Edge-Deployed Front End (Next.js)</div>
                <div class="v-node-meta">Sub-100ms global cache · Zero Liquid bloat</div>
              </div>
              <span class="v-node-badge" style="background:#F94500;color:#FFFDB4">EDGE</span>
            </div>
            <div class="v-connector"></div>
            <div class="v-node">
              <div>
                <div class="v-node-title">GraphQL Storefront API Gateway</div>
                <div class="v-node-meta">Token-authenticated catalog queries · Cart mutations</div>
              </div>
              <span class="v-node-badge" style="background:#2E0B4F;color:#BCACCE">REST/GQL</span>
            </div>
            <div class="v-connector"></div>
            <div class="v-node">
              <div>
                <div class="v-node-title">Shopify Commerce Core &amp; Checkout</div>
                <div class="v-node-meta">PCI-DSS Level 1 compliant payments · Order fulfillment</div>
              </div>
              <span class="v-node-badge" style="background:#18002C;color:#85d893">SECURE</span>
            </div>
          </div>
        </div>
        <div class="badge-overlap yellow" style="top: 30px; right: 15px;">
          ${SPARK}
        </div>
      `;
    } else if (isSecurity) {
      // Archetype 3: Security & Forensic Audit Terminal
      art.innerHTML = `
        <div class="v-card">
          <div class="v-titlebar">
            <div class="v-dots"><div class="v-dot red"></div><div class="v-dot yellow"></div><div class="v-dot lilac"></div></div>
            <span class="v-filename">security-audit.sh</span>
            <span class="v-status" style="background:rgba(255,253,180,0.15);color:var(--yellow);border-color:var(--yellow)">ISOLATION PASS</span>
          </div>
          <pre class="v-code">
<span class="cmt"># Checking database and core file checksums...</span>
<span class="kw">$</span> kawaki-audit --scan-backdoors
<span class="str">&gt; Scanned 14,821 files against official core hashes</span>
<span class="str">&gt; [CLEANED] Removed eval(base64_decode) in header.php</span>
<span class="str">&gt; [PURGED] Neutralized rogue admin: db_sys_worker</span>

<span class="kw">$</span> test-cloaking --user-agent="Googlebot-Mobile"
<span class="val">&gt; STATUS: 200 OK (Malicious conditional redirect resolved)</span>
<span class="val">&gt; Server permissions hardened: chmod 440 wp-config.php</span></pre>
        </div>
        <div class="badge-overlap red" style="bottom: 30px; left: 10px;">
          ${ASTERISK}
        </div>
      `;
    } else if (isNext) {
      // Archetype 4: Next.js Server Components & Boundary Architecture
      art.innerHTML = `
        <div class="v-card">
          <div class="v-titlebar">
            <div class="v-dots"><div class="v-dot red"></div><div class="v-dot yellow"></div><div class="v-dot lilac"></div></div>
            <span class="v-filename">app/catalog/page.tsx</span>
            <span class="v-status">SERVER COMPONENT</span>
          </div>
          <pre class="v-code">
<span class="cmt">// Edge server runtime with zero client JS weight</span>
<span class="kw">export default async function</span> <span class="fn">CatalogPage</span>() {
  <span class="kw">const</span> data = <span class="kw">await</span> <span class="fn">fetchStorefront</span>({
    <span class="key">revalidate</span>: <span class="val">3600</span>, <span class="key">tags</span>: [<span class="str">'products'</span>]
  });

  <span class="kw">return</span> (
    <span class="str">&lt;Shell&gt;</span>
      <span class="str">&lt;ServerHero</span> <span class="key">title</span>=<span class="val">{data.hero}</span> <span class="str">/&gt;</span>
      <span class="cmt">{/* Interactive island boundary */}</span>
      <span class="str">&lt;ClientFilter</span> <span class="key">facets</span>=<span class="val">{data.facets}</span> <span class="str">/&gt;</span>
    <span class="str">&lt;/Shell&gt;</span>
  );
}</pre>
        </div>
        <div class="badge-overlap yellow" style="bottom: 35px; right: 25px;">
          ${SPARK}
        </div>
      `;
    } else {
      // Archetype 5: Telemetry & Core Web Vitals Performance Dashboard
      art.innerHTML = `
        <div class="v-card">
          <div class="v-titlebar">
            <div class="v-dots"><div class="v-dot red"></div><div class="v-dot yellow"></div><div class="v-dot lilac"></div></div>
            <span class="v-filename">production-telemetry.json</span>
            <span class="v-status">AUDIT 100/100</span>
          </div>
          <div class="v-telemetry">
            <div class="v-metric">
              <div class="v-metric-label">Largest Paint (LCP)</div>
              <div class="v-metric-val">0.68s</div>
              <div class="v-metric-status">✓ Target: &lt; 2.5s</div>
            </div>
            <div class="v-metric">
              <div class="v-metric-label">Interaction (INP)</div>
              <div class="v-metric-val">28ms</div>
              <div class="v-metric-status">✓ Target: &lt; 200ms</div>
            </div>
            <div class="v-metric">
              <div class="v-metric-label">Cumulative Shift</div>
              <div class="v-metric-val">0.00</div>
              <div class="v-metric-status">✓ Zero layout shift</div>
            </div>
            <div class="v-metric">
              <div class="v-metric-label">Server TTFB</div>
              <div class="v-metric-val red">42ms</div>
              <div class="v-metric-status">✓ Edge cache hit</div>
            </div>
          </div>
        </div>
        <div class="badge-overlap red" style="bottom: 35px; right: 25px;">
          ${ASTERISK}
        </div>
      `;
    }
  }

  renderVisual();

  // Strip of kept and struck words
  const words = (q.get('w') || 'Plain words|cut:Filler|Real work|cut:Templates').split('|');
  document.getElementById('strip').innerHTML = words.map(w => w.startsWith('cut:')
    ? `<span class="cut">${w.slice(4)}</span><span class="arrow"></span>`
    : `<span>${w}</span><span class="sep">&#10035;</span>`).join('');

  document.body.dataset.ready = '1';
</script>
