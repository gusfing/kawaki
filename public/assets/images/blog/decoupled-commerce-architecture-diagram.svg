<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" style="background:#23003F;font-family:'Bricolage Grotesque',sans-serif;">
  <defs>
    <style>
      .title { font-size: 28px; font-weight: 700; fill: #FFFDB4; letter-spacing: -0.02em; }
      .subtitle { font-size: 14px; font-family: 'Geist Mono', monospace; fill: #BCACCE; letter-spacing: 0.08em; text-transform: uppercase; }
      .box-title { font-size: 16px; font-weight: 700; fill: #FFFDB4; }
      .box-desc { font-size: 13px; fill: #BCACCE; line-height: 1.4; }
      .mono { font-family: 'Geist Mono', monospace; font-size: 11px; fill: #BCACCE; letter-spacing: 0.05em; }
      .accent-badge { fill: #F94500; }
      .badge-text { font-family: 'Geist Mono', monospace; font-size: 10px; font-weight: 700; fill: #FFFDB4; letter-spacing: 0.08em; text-transform: uppercase; }
      .arrow { stroke: #BCACCE; stroke-width: 2; stroke-dasharray: 4 4; fill: none; }
      .arrow-solid { stroke: #F94500; stroke-width: 2.5; fill: none; }
      .card { fill: #2E0B4F; stroke: #3E1268; stroke-width: 1.5; rx: 6px; }
      .card-highlight { fill: #2A0949; stroke: #F94500; stroke-width: 2; rx: 6px; }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#BCACCE" />
    </marker>
    <marker id="arrowhead-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#F94500" />
    </marker>
  </defs>

  <!-- Header -->
  <text x="60" y="55" class="subtitle">Architecture Comparison</text>
  <text x="60" y="92" class="title">Native Liquid Monolith vs Decoupled Storefront</text>

  <!-- Divider Line -->
  <line x1="60" y1="120" x2="1140" y2="120" stroke="#3E1268" stroke-width="1.5" />

  <!-- LEFT: Monolithic Architecture -->
  <g transform="translate(60, 145)">
    <!-- Column Title -->
    <rect x="0" y="0" width="480" height="475" class="card" />
    <rect x="20" y="20" width="130" height="24" rx="4" fill="#3D1066" />
    <text x="30" y="36" class="badge-text" fill="#FFFDB4">Monolithic Liquid</text>
    <text x="20" y="75" class="box-title">Coupled Theme Engine</text>
    <text x="20" y="98" class="box-desc">Single stack where templates, logic and data render server-side on Shopify.</text>

    <!-- Block 1: Browser -->
    <rect x="30" y="130" width="420" height="70" rx="4" fill="#18002C" stroke="#3E1268" />
    <text x="50" y="158" class="box-title">Client Browser</text>
    <text x="50" y="180" class="mono">Requests HTML document per route transition</text>

    <!-- Arrow Down -->
    <path d="M 240 200 L 240 240" class="arrow" marker-end="url(#arrowhead)" />

    <!-- Block 2: Liquid Server -->
    <rect x="30" y="245" width="420" height="110" rx="4" fill="#18002C" stroke="#3E1268" />
    <text x="50" y="275" class="box-title">Shopify Liquid Renderer</text>
    <text x="50" y="300" class="box-desc">Server-side Liquid compilation, theme assets, and app script tags.</text>
    <text x="50" y="325" class="mono">Blocking HTML generation on server</text>

    <!-- Arrow Down -->
    <path d="M 240 355 L 240 385" class="arrow" marker-end="url(#arrowhead)" />

    <!-- Block 3: Core Database -->
    <rect x="30" y="390" width="420" height="65" rx="4" fill="#18002C" stroke="#3E1268" />
    <text x="50" y="418" class="box-title">Shopify Store Database</text>
    <text x="50" y="438" class="mono">Products, inventory, customer accounts and checkout</text>
  </g>

  <!-- RIGHT: Decoupled Architecture -->
  <g transform="translate(660, 145)">
    <!-- Column Title -->
    <rect x="0" y="0" width="480" height="475" class="card-highlight" />
    <rect x="20" y="20" width="165" height="24" rx="4" class="accent-badge" />
    <text x="30" y="36" class="badge-text">Decoupled Headless</text>
    <text x="20" y="75" class="box-title">Independent Frontend + Storefront API</text>
    <text x="20" y="98" class="box-desc">Global edge distribution with structured data caching and isolated backend.</text>

    <!-- Block 1: Edge Frontend -->
    <rect x="30" y="130" width="420" height="75" rx="4" fill="#18002C" stroke="#4A157C" />
    <text x="50" y="158" class="box-title">Edge-Deployed Front End (Next.js / Static)</text>
    <text x="50" y="180" class="mono">Global CDN cache, instant client transitions, custom UI</text>

    <!-- Bi-directional arrows -->
    <path d="M 170 205 L 170 250" class="arrow-solid" marker-end="url(#arrowhead-red)" />
    <path d="M 310 250 L 310 205" class="arrow-solid" marker-end="url(#arrowhead-red)" />
    <text x="185" y="232" class="mono" fill="#F94500">GraphQL Storefront API</text>

    <!-- Block 2: Middle Orchestration & CMS -->
    <rect x="30" y="255" width="420" height="95" rx="4" fill="#18002C" stroke="#4A157C" />
    <text x="50" y="285" class="box-title">Shopify Storefront API + Content Layer</text>
    <text x="50" y="307" class="box-desc">Token-authenticated product queries, cart mutations, and structured CMS.</text>
    <text x="50" y="330" class="mono">Fast JSON payloads with cache tags</text>

    <!-- Arrow Down to Core -->
    <path d="M 240 350 L 240 385" class="arrow" marker-end="url(#arrowhead)" />

    <!-- Block 3: Hardened Backend -->
    <rect x="30" y="390" width="420" height="65" rx="4" fill="#18002C" stroke="#4A157C" />
    <text x="50" y="418" class="box-title">Shopify Commerce Core & Checkout</text>
    <text x="50" y="438" class="mono">Native PCI-compliant checkout, payments, and order fulfillment</text>
  </g>
</svg>
