<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" style="background:#23003F;font-family:'Bricolage Grotesque',sans-serif;">
  <defs>
    <style>
      .title { font-size: 28px; font-weight: 700; fill: #FFFDB4; letter-spacing: -0.02em; }
      .subtitle { font-size: 14px; font-family: 'Geist Mono', monospace; fill: #BCACCE; letter-spacing: 0.08em; text-transform: uppercase; }
      .layer-tag { font-family: 'Geist Mono', monospace; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; }
      .layer-title { font-size: 18px; font-weight: 700; fill: #FFFDB4; }
      .layer-desc { font-size: 13.5px; fill: #BCACCE; line-height: 1.45; }
      .mono-bullet { font-family: 'Geist Mono', monospace; font-size: 11.5px; fill: #BCACCE; }
      .layer-card { fill: #2E0B4F; stroke: #3E1268; stroke-width: 1.5; rx: 6px; }
      .layer-card-top { fill: #2A0949; stroke: #F94500; stroke-width: 2; rx: 6px; }
    </style>
  </defs>

  <!-- Header -->
  <text x="60" y="55" class="subtitle">Framework &amp; Optimization Stack</text>
  <text x="60" y="92" class="title">The Generative Engine Optimization (GEO) Technical Pyramid</text>

  <!-- Divider Line -->
  <line x1="60" y1="120" x2="1140" y2="120" stroke="#3E1268" stroke-width="1.5" />

  <!-- STACK CONTAINER -->
  <g transform="translate(60, 150)">
    <!-- LAYER 3: TOP (Attribution & Direct Answers) -->
    <rect x="0" y="0" width="1080" height="135" class="layer-card-top" />
    <rect x="25" y="20" width="95" height="22" rx="4" fill="#F94500" />
    <text x="35" y="35" class="layer-tag" fill="#FFFDB4">TIER 03</text>
    <text x="135" y="36" class="layer-title">Direct Answer Synthesis &amp; Quotable Fact Density</text>
    <text x="25" y="70" class="layer-desc">Language models extract information when answers precede explanation. Concise 40 to 60 word definition paragraphs, plain factual declarations, and verified empirical claims directly qualify for extractive quotation.</text>
    <text x="25" y="105" class="mono-bullet" fill="#FFFDB4">Key Signals: First-sentence definitions | Unambiguous data tables | Verifiable author credentials</text>

    <!-- LAYER 2: MIDDLE (Semantic Structure & Entity Markup) -->
    <rect x="0" y="155" width="1080" height="135" class="layer-card" />
    <rect x="25" y="175" width="95" height="22" rx="4" fill="#18002C" />
    <text x="35" y="190" class="layer-tag" fill="#F94500">TIER 02</text>
    <text x="135" y="191" class="layer-title">Semantic Entity Modeling &amp; Schema.org JSON-LD</text>
    <text x="25" y="225" class="layer-desc">RAG retrieval engines parse structured data to resolve ambiguous terms into defined knowledge graph entities. Full schema markup verifies organization identity, service offerings, and pricing ranges across the domain.</text>
    <text x="25" y="260" class="mono-bullet">Key Signals: Organization &amp; Service JSON-LD | SameAs entity links | FAQPage &amp; Article markup</text>

    <!-- LAYER 1: FOUNDATION (Crawlability & Server Performance) -->
    <rect x="0" y="310" width="1080" height="135" class="layer-card" />
    <rect x="25" y="330" width="95" height="22" rx="4" fill="#18002C" />
    <text x="35" y="345" class="layer-tag" fill="#BCACCE">TIER 01</text>
    <text x="135" y="346" class="layer-title">Raw Crawlability, Clean HTML &amp; Server-Side Rendering</text>
    <text x="25" y="380" class="layer-desc">AI web bots (GPTBot, ClaudeBot, PerplexityBot) run on strict timeout budgets and frequently bypass heavy client-side JavaScript. Pre-rendered, semantic HTML ensures crawlers consume body text on initial request.</text>
    <text x="25" y="415" class="mono-bullet">Key Signals: Server-rendered HTML | Unblocked robots.txt | Strict heading hierarchy (H1 -> H2 -> H3)</text>
  </g>
</svg>
