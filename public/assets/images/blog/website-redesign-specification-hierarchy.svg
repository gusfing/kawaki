<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a0c" />
      <stop offset="100%" stop-color="#121217" />
    </linearGradient>
    <linearGradient id="accentLime" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c6ff00" />
      <stop offset="100%" stop-color="#00ff66" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#18181e" />
      <stop offset="100%" stop-color="#101014" />
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="675" fill="url(#bgGrad)" />

  <!-- Subtle Blueprint Grid -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="675" />
    <line x1="360" y1="0" x2="360" y2="675" />
    <line x1="640" y1="0" x2="640" y2="675" />
    <line x1="920" y1="0" x2="920" y2="675" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="380" x2="1200" y2="380" />
    <line x1="0" y1="580" x2="1200" y2="580" />
  </g>

  <!-- Header Section -->
  <text x="80" y="85" fill="#a1a1aa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="2">ARCHITECTURAL SPECIFICATION FRAMEWORK</text>
  <text x="80" y="125" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" letter-spacing="-0.5">Four Pillars of a Production Website Redesign Brief</text>

  <!-- 4 Pillar Cards -->
  <!-- Pillar 1 -->
  <g transform="translate(80, 175)" filter="url(#cardShadow)">
    <rect width="240" height="420" rx="16" fill="url(#cardGrad)" stroke="#27272a" stroke-width="1" />
    <rect x="0" y="0" width="240" height="4" rx="2" fill="url(#accentLime)" />
    <circle cx="36" cy="40" r="14" fill="#22222a" />
    <text x="36" y="45" fill="#c6ff00" font-family="monospace" font-size="13" font-weight="700" text-anchor="middle">01</text>
    <text x="36" y="88" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700">Commercial Goals</text>
    <text x="36" y="112" fill="#71717a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Quantifiable Benchmarks</text>

    <line x1="36" y1="135" x2="204" y2="135" stroke="#27272a" stroke-width="1" />

    <text x="36" y="165" fill="#a1a1aa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">• Inbound Lead Targets</text>
    <text x="36" y="190" fill="#71717a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Baseline vs 3%+ Conversion</text>

    <text x="36" y="230" fill="#a1a1aa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">• Mobile CWV Goals</text>
    <text x="36" y="255" fill="#71717a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Sub-2.0s Real-World LCP</text>

    <text x="36" y="295" fill="#a1a1aa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">• Organic Traffic Parity</text>
    <text x="36" y="320" fill="#71717a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Zero Rank Decay Protocol</text>

    <rect x="24" y="355" width="192" height="38" rx="8" fill="#141418" stroke="#222228" />
    <text x="120" y="379" fill="#c6ff00" font-family="monospace" font-size="11" font-weight="600" text-anchor="middle">KPI CONTRACT</text>
  </g>

  <!-- Pillar 2 -->
  <g transform="translate(350, 175)" filter="url(#cardShadow)">
    <rect width="240" height="420" rx="16" fill="url(#cardGrad)" stroke="#27272a" stroke-width="1" />
    <rect x="0" y="0" width="240" height="4" rx="2" fill="#00e5ff" />
    <circle cx="36" cy="40" r="14" fill="#22222a" />
    <text x="36" y="45" fill="#00e5ff" font-family="monospace" font-size="13" font-weight="700" text-anchor="middle">02</text>
    <text x="36" y="88" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700">Platform Scope</text>
    <text x="36" y="112" fill="#71717a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Engineering Architecture</text>

    <line x1="36" y1="135" x2="204" y2="135" stroke="#27272a" stroke-width="1" />

    <text x="36" y="165" fill="#a1a1aa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">• Modern Framework</text>
    <text x="36" y="190" fill="#71717a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Next.js / SSR / Edge Cache</text>

    <text x="36" y="230" fill="#a1a1aa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">• Decoupled CMS</text>
    <text x="36" y="255" fill="#71717a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Markdown or Headless API</text>

    <text x="36" y="295" fill="#a1a1aa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">• Code Governance</text>
    <text x="36" y="320" fill="#71717a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Strict TypeScript Typing</text>

    <rect x="24" y="355" width="192" height="38" rx="8" fill="#141418" stroke="#222228" />
    <text x="120" y="379" fill="#00e5ff" font-family="monospace" font-size="11" font-weight="600" text-anchor="middle">TECH BOUNDARIES</text>
  </g>

  <!-- Pillar 3 -->
  <g transform="translate(620, 175)" filter="url(#cardShadow)">
    <rect width="240" height="420" rx="16" fill="url(#cardGrad)" stroke="#27272a" stroke-width="1" />
    <rect x="0" y="0" width="240" height="4" rx="2" fill="#a78bfa" />
    <circle cx="36" cy="40" r="14" fill="#22222a" />
    <text x="36" y="45" fill="#a78bfa" font-family="monospace" font-size="13" font-weight="700" text-anchor="middle">03</text>
    <text x="36" y="88" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700">Content Matrix</text>
    <text x="36" y="112" fill="#71717a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Migration &amp; Governance</text>

    <line x1="36" y1="135" x2="204" y2="135" stroke="#27272a" stroke-width="1" />

    <text x="36" y="165" fill="#a1a1aa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">• Full URL Inventory</text>
    <text x="36" y="190" fill="#71717a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Crawl Mapping &amp; Classification</text>

    <text x="36" y="230" fill="#a1a1aa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">• 301 Redirect Tree</text>
    <text x="36" y="255" fill="#71717a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">1-to-1 Semantic Alignment</text>

    <text x="36" y="295" fill="#a1a1aa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">• Asset Pipeline</text>
    <text x="36" y="320" fill="#71717a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">WebP/AVIF Image Encoding</text>

    <rect x="24" y="355" width="192" height="38" rx="8" fill="#141418" stroke="#222228" />
    <text x="120" y="379" fill="#a78bfa" font-family="monospace" font-size="11" font-weight="600" text-anchor="middle">ASSET PARITY</text>
  </g>

  <!-- Pillar 4 -->
  <g transform="translate(890, 175)" filter="url(#cardShadow)">
    <rect width="240" height="420" rx="16" fill="url(#cardGrad)" stroke="#27272a" stroke-width="1" />
    <rect x="0" y="0" width="240" height="4" rx="2" fill="#38bdf8" />
    <circle cx="36" cy="40" r="14" fill="#22222a" />
    <text x="36" y="45" fill="#38bdf8" font-family="monospace" font-size="13" font-weight="700" text-anchor="middle">04</text>
    <text x="36" y="88" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700">Integrations</text>
    <text x="36" y="112" fill="#71717a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">API &amp; Webhook Scopes</text>

    <line x1="36" y1="135" x2="204" y2="135" stroke="#27272a" stroke-width="1" />

    <text x="36" y="165" fill="#a1a1aa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">• CRM &amp; Lead Ingestion</text>
    <text x="36" y="190" fill="#71717a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Webhook Failure Queues</text>

    <text x="36" y="230" fill="#a1a1aa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">• Payment Gateway</text>
    <text x="36" y="255" fill="#71717a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">PCI-DSS Tokenization</text>

    <text x="36" y="295" fill="#a1a1aa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">• Analytics &amp; Privacy</text>
    <text x="36" y="320" fill="#71717a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Server-Side Consent Gates</text>

    <rect x="24" y="355" width="192" height="38" rx="8" fill="#141418" stroke="#222228" />
    <text x="120" y="379" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="600" text-anchor="middle">API CONTRACTS</text>
  </g>
</svg>
