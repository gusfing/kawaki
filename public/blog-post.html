<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting... — Kawaki Studios</title>
    <meta name="robots" content="noindex, follow" />
    <link rel="canonical" href="https://www.kawaki.co.in/blog" />
    <script>
        (function() {
            try {
                var params = new URLSearchParams(window.location.search);
                var slug = params.get('slug');
                if (slug) {
                    window.location.replace('/blog/' + encodeURIComponent(slug));
                } else {
                    window.location.replace('/blog');
                }
            } catch(e) {
                window.location.replace('/blog');
            }
        })();
    </script>
</head>
<body style="margin: 0; background: #FFFFFF; font-family: 'Plus Jakarta Sans', -apple-system, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh;">
    <div style="text-align: center; padding: 2rem;">
        <h2 style="font-size: 1.5rem; color: #111; margin-bottom: 0.5rem; font-weight: 700;">Redirecting to Journal...</h2>
        <p style="color: #6B7280; font-size: 14px; margin-bottom: 1.5rem;">We have upgraded our journal architecture to clean, sub-second URLs.</p>
        <a href="/blog" style="color: #111; font-weight: 600; text-decoration: underline; text-underline-offset: 4px; font-size: 14px;">Visit Kawaki Journal &rarr;</a>
    </div>
</body>
</html>
